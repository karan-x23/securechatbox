name: chat-tests
on:
  push:
    branches: [main, whatsapp-style-upgrade, seen-status-mobile-polish]
  pull_request:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - name: Check browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('static/index.html').read_text(encoding='utf-8')
          script = html.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/securechatbox-inline.js').write_text(script, encoding='utf-8')
          PY
          node --check /tmp/securechatbox-inline.js
